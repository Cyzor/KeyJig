name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Derive version and build number
        id: version
        run: |
          # Strip leading 'v' from tag (v1.2.3 → 1.2.3)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "marketing=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build (Release)
        run: |
          xcodebuild \
            -project KeyJig.xcodeproj \
            -scheme KeyJig \
            -configuration Release \
            -archivePath $RUNNER_TEMP/KeyJig.xcarchive \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export app
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/KeyJig.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/export/KeyJig.app" \
            $RUNNER_TEMP/KeyJig-notarize.zip
          xcrun notarytool submit $RUNNER_TEMP/KeyJig-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple and package
        run: |
          xcrun stapler staple "$RUNNER_TEMP/export/KeyJig.app"
          VERSION="${{ steps.version.outputs.marketing }}"

          # ZIP — plain stapled .app bundle
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/export/KeyJig.app" \
            "$RUNNER_TEMP/KeyJig-${VERSION}.zip"

          # DMG — app + Applications symlink, compressed read-only image
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$RUNNER_TEMP/export/KeyJig.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "KeyJig ${VERSION}" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$RUNNER_TEMP/KeyJig-${VERSION}.dmg"
          codesign \
            --sign "Developer ID Application" \
            --timestamp \
            "$RUNNER_TEMP/KeyJig-${VERSION}.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ steps.version.outputs.marketing }}"
          xcrun notarytool submit "$RUNNER_TEMP/KeyJig-${VERSION}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/KeyJig-${VERSION}.dmg"

      - name: Verify DMG signature and Gatekeeper acceptance
        run: |
          VERSION="${{ steps.version.outputs.marketing }}"
          DMG="$RUNNER_TEMP/KeyJig-${VERSION}.dmg"
          codesign --verify --verbose=2 "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          xcrun stapler validate "$DMG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.marketing }}"
          # Use the tag's annotation message as release notes.
          # Falls back to a minimal note if the tag is lightweight.
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION"
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/KeyJig-${VERSION}.dmg" \
            "$RUNNER_TEMP/KeyJig-${VERSION}.zip" \
            --title "KeyJig $VERSION" \
            --notes "$NOTES" \
            --draft
